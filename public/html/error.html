<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · Todoist MCP</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>/*{{STYLES}}*/</style>
</head>
<body>
  <div class="wrap">
    <header><a href="/"><img src="/favicon.svg" alt="">Todoist MCP</a></header>

    <main>
      <h1>{{TITLE}}</h1>
      <p class="lead">Something went wrong while connecting your Todoist account.</p>
      <pre style="white-space: pre-wrap">{{MESSAGE}}</pre>
      <p style="margin-top: 24px"><a class="btn" href="/auth">Try again</a></p>
    </main>

    <footer>
      <a href="https://github.com/rosenpin/todoist-mcp-server/issues" target="_blank" rel="noopener">Report an issue</a>
      <a href="mailto:i@rosenpin.io">i@rosenpin.io</a>
    </footer>
  </div>
</body>
</html>
